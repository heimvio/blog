# Baut das Blog-Image (statische Site + blog-api, ./Dockerfile) und legt es
# auf ghcr.io ab; heimvio.de zieht es per Timer (heimvio-Repo:
# ops/blog/blog-sync.sh, Plan #160 R2c). Es gibt keinen Weg vom Repo auf den
# Host: kein ssh, kein Secret ausser dem automatischen GITHUB_TOKEN.
#
# Sicherheit (oeffentliches Repo):
#   - nur push auf main und workflow_dispatch — KEIN pull_request(_target),
#     Laeufe aus Forks bekommen weder Token noch Paketrecht;
#   - Build-Attestation (SLSA-Provenance) am Image: der Host kann pruefen,
#     dass genau dieser Workflow dieses Repos das Image gebaut hat.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Zusammenfassung
        run: |
          {
            echo "### Blog-Image"
            echo "- \`${IMAGE}:main\`"
            echo "- Digest \`${{ steps.push.outputs.digest }}\`"
            echo "- heimvio.de zieht es innerhalb von 5 min (ops/blog/blog-sync.sh)"
          } >> "$GITHUB_STEP_SUMMARY"

# Content-Deploy: Push auf main → Astro-Build auf dem Gitea-Runner → per ssh
# nach /var/www/heimvio-content auf heimvio.de (von Caddy read-only gemountet)
# → blog-api-Image dort bauen und rollen → Smoke-Check.
# EIN Build liefert beide Sektionen: dist/blog/ → /blog/ und dist/doku/ → /doku/.
#
# Läuft auf ubuntu-latest (LXC heimvio-runner-fast auf ubuntupve), NICHT mehr
# auf dem Zielhost: der früher genutzte Runner heimvio-de ist seit seiner
# Neu-Registrierung am 28.08.2026 nur noch für das Repo heimvio/heimvio
# zuständig, dieses Repo sah keinen Runner und jeder Lauf blieb in der
# Warteschlange liegen — die Doku war deshalb seit 14.07.2026 nicht mehr
# aktuell. Die Auslieferung läuft jetzt wie beim heimvio-Deployment-Paket über
# ssh (Secret HETZNER_SSH_KEY, base64-kodierter Key „heimvio-blog-deploy" in
# /root/.ssh/authorized_keys).
name: deploy-blog

on:
  push:
    branches: [main]

concurrency:
  group: deploy-blog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # cache-server des Runners, s. ops/proxvex/local/applications/heimvio-runner/config.yaml
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Astro-Site bauen
        run: npm run build

      - name: Auf heimvio.de ausliefern
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: bash deploy/upload-to-hetzner.sh

      - name: Smoke-Check
        run: |
          sleep 3
          curl -fsS https://heimvio.de/blog/ >/dev/null && echo "ok /blog/"
          curl -fsS https://heimvio.de/doku/ >/dev/null && echo "ok /doku/"
          curl -fsS https://heimvio.de/api/comments/smoke-test >/dev/null && echo "ok /api/comments"
